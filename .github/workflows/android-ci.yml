name: Android APK and final checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Python policy and native-check tests
        run: |
          python3 -m unittest discover -s server -p "test_*.py" -v
          python3 -m unittest discover -s scripts -p "test_*.py" -v
      - name: Build APK, unsigned release bundle, tests and lint
        run: gradle :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:bundleRelease :app:lintRelease --no-daemon --continue
      - name: Check packaged native ELF alignment
        if: always()
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            python3 scripts/check_native_pages.py app/build/outputs/apk/debug/app-debug.apk --report app/build/reports/native-pages-debug.json
          else
            echo "APK not built; native check unavailable"
            exit 1
          fi
      - name: Check APK ZIP alignment
        if: always()
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk
      - name: Check release bundle native alignment
        if: always()
        run: |
          python3 scripts/check_native_pages.py app/build/outputs/bundle/release/app-release.aab --report app/build/reports/native-pages-release.json
      - name: Upload diagnostics and unsigned bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Final-checks-and-unsigned-AAB-0.15
          retention-days: 3
          path: |
            app/build/reports/lint-results-*
            app/build/reports/native-pages-*.json
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore
      - name: Upload phone test APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI-Game-Translator-0.15-final-checks-debug
          retention-days: 3
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
