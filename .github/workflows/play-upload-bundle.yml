name: Build private Play upload bundle

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    environment: play-release

    env:
      PLAY_UPLOAD_STORE_FILE: /tmp/play-upload.jks
      PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
      PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
      PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
      PLAY_LICENSE_KEY: ${{ secrets.PLAY_LICENSE_KEY }}
      PLAY_PRIVACY_URL: ${{ secrets.PLAY_PRIVACY_URL }}
      PLAY_SUPPORT_EMAIL: ${{ secrets.PLAY_SUPPORT_EMAIL }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android build packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Restore private upload key
        env:
          UPLOAD_KEY_BASE64: ${{ secrets.PLAY_UPLOAD_STORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          import pathlib

          value = os.environ.get("UPLOAD_KEY_BASE64", "")
          if not value:
              raise SystemExit("Set PLAY_UPLOAD_STORE_BASE64 secret")

          target = pathlib.Path(os.environ["PLAY_UPLOAD_STORE_FILE"])
          target.write_bytes(base64.b64decode(value, validate=True))
          target.chmod(0o600)
          PY

      - name: Build and validate
        run: >
          gradle
          :app:playSubmissionBundle
          :app:testDebugUnitTest
          :app:lintRelease
          --no-daemon

      - name: Native alignment check
        run: >
          python3 scripts/check_native_pages.py
          app/build/outputs/bundle/release/app-release.aab
          --report app/build/reports/native-pages-release.json

      - name: Put signed bundle in developer draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          printf '%s\n' \
            'Signed upload bundle. Not submitted to Play. Complete license tests, privacy forms and device checks before rollout.' \
            > "$RUNNER_TEMP/play-notes.txt"

          gh release create \
            "play-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            app/build/outputs/bundle/release/app-release.aab \
            --draft \
            --target "$GITHUB_SHA" \
            --title 'Play release candidate' \
            --notes-file "$RUNNER_TEMP/play-notes.txt"

      - name: Remove upload key
        if: always()
        run: rm -f "$PLAY_UPLOAD_STORE_FILE"
